services:
  - type: web
    name: urpiece
    env: node
    region: frankfurt
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: urpiece-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false          # set manually to your Render URL after first deploy
      - key: NODE_ENV
        value: production
      - key: UPLOAD_DIR
        value: /tmp/uploads  # ephemeral — use object storage for persistent uploads

databases:
  - name: urpiece-db
    plan: free
    region: frankfurt
